spring.application.name=garage-service

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.j$.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.property-naming-strategy=SNAKE_CASE


  private void setVehicule(Vehicule vehicule, VehiculeRequest request){
        vehicule.setImmatriculationFictive(request.immatriculationFictive());
        vehicule.setModele(request.modele());
        vehicule.setAnnee(request.annee());
        vehicule.setMarque(request.marque());
        vehicule.setKilometrage(request.kilometrage());
        vehicule.setClientFictif(request.clientFictif());
    }
